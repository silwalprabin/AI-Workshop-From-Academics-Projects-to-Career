services:
  code-review-agent:
    build: .
    # Allow the container to reach an Ollama daemon running on the host machine
    # via http://host.docker.internal:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # Mount the workshop datasets so the local sample repo is reviewable.
    volumes:
      - ../../datasets:/datasets:ro
